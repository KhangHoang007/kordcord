<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KordCord — Chat cùng bạn bè</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#313338;--bg2:#2b2d31;--bg3:#1e1f22;--bg4:#232428;--text:#dbdee1;--muted:#949ba4;--blurple:#5865f2;--blurple2:#4752c4;--green:#23a55a;--red:#f23f43;--input:#383a40}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none}
input{font-family:inherit}
.hidden{display:none!important}
/* ---------- AUTH ---------- */
#authView{height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#5865f2 0%,#313338 55%)}
.authCard{background:var(--bg);border-radius:8px;padding:32px;width:420px;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.authCard h1{font-size:24px;text-align:center;margin-bottom:6px}
.authCard p.sub{color:var(--muted);text-align:center;margin-bottom:20px;font-size:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.field input{width:100%;background:var(--bg3);border:none;border-radius:4px;padding:11px;color:var(--text);font-size:15px;outline:none}
.btnPrimary{width:100%;background:var(--blurple);color:#fff;padding:12px;border-radius:4px;font-size:15px;font-weight:600}
.btnPrimary:hover{background:var(--blurple2)}
.authErr{background:rgba(242,63,67,.12);color:#ff8a8d;border:1px solid rgba(242,63,67,.4);padding:9px 12px;border-radius:4px;font-size:13px;margin-bottom:14px}
.authSwitch{margin-top:14px;font-size:13px;color:var(--muted);text-align:center}
.authSwitch a{color:#00a8fc;cursor:pointer;text-decoration:none}
#inviteBanner{background:rgba(35,165,90,.15);border:1px solid rgba(35,165,90,.5);color:#7ee2a8;padding:10px 12px;border-radius:4px;font-size:13px;margin-bottom:14px;text-align:center}
/* ---------- APP LAYOUT ---------- */
#appView{display:flex;height:100vh}
#serverRail{width:72px;background:var(--bg3);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:8px;overflow-y:auto;flex-shrink:0}
.serverIcon{width:48px;height:48px;border-radius:50%;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;cursor:pointer;transition:border-radius .15s,background .15s;flex-shrink:0;text-align:center;padding:2px;overflow:hidden}
.serverIcon:hover,.serverIcon.active{border-radius:16px;background:var(--blurple);color:#fff}
.serverIcon.add{background:var(--bg);color:var(--green);font-size:24px;font-weight:400}
.serverIcon.add:hover{background:var(--green);color:#fff}
.railSep{width:32px;height:2px;background:var(--bg);border-radius:1px;margin:2px 0}
#channelCol{width:240px;background:var(--bg2);display:flex;flex-direction:column;flex-shrink:0}
#serverHeader{padding:14px 16px;font-weight:700;font-size:15px;border-bottom:1px solid rgba(0,0,0,.25);display:flex;justify-content:space-between;align-items:center;min-height:49px}
#inviteBtn{background:var(--blurple);color:#fff;font-size:12px;padding:6px 10px;border-radius:4px;font-weight:600}
#channelList{flex:1;overflow-y:auto;padding:8px}
.catRow{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em;padding:14px 6px 4px}
.catRow button{background:none;color:var(--muted);font-size:16px;line-height:1}
.catRow button:hover{color:var(--text)}
.channelItem{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:4px;color:var(--muted);cursor:pointer;font-size:15px;margin-bottom:2px}
.channelItem:hover{background:rgba(255,255,255,.04);color:var(--text)}
.channelItem.active{background:rgba(255,255,255,.08);color:#fff}
.channelItem .hash{color:#80848e;font-size:18px}
.channelItem .spk{font-size:14px}
.voiceUsers{margin-left:26px;font-size:13px;color:var(--muted)}
.voiceUsers div{padding:2px 0;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
#userBar{background:var(--bg4);padding:10px;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;position:relative}
.avatar .dot{position:absolute;bottom:-1px;right:-1px;border:3px solid var(--bg4);width:13px;height:13px}
#userBar .uname{font-size:13px;font-weight:600;line-height:1.2}
#userBar .ustatus{font-size:11px;color:var(--muted)}
#logoutBtn{margin-left:auto;background:none;color:var(--muted);font-size:16px}
#logoutBtn:hover{color:var(--red)}
/* ---------- MAIN ---------- */
#mainCol{flex:1;display:flex;flex-direction:column;min-width:0}
#chatHeader{height:49px;border-bottom:1px solid rgba(0,0,0,.25);display:flex;align-items:center;padding:0 16px;gap:8px;font-weight:700;flex-shrink:0}
#chatHeader .hash{color:#80848e;font-size:22px}
#chatHeader .topic{color:var(--muted);font-weight:400;font-size:13px;border-left:1px solid #3f4147;padding-left:10px;margin-left:2px}
#messages{flex:1;overflow-y:auto;padding:16px}
.msg{display:flex;gap:14px;padding:6px 8px;border-radius:4px}
.msg:hover{background:rgba(0,0,0,.08)}
.msg .avatar{width:40px;height:40px;font-size:15px}
.msgHead{display:flex;gap:8px;align-items:baseline}
.msgAuthor{font-weight:600;font-size:15px}
.msgTime{color:var(--muted);font-size:11px}
.msgBody{font-size:15px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
#typingBar{height:22px;padding:0 16px;font-size:12px;color:var(--muted)}
#inputBar{padding:0 16px 20px;flex-shrink:0}
#msgInputWrap{background:var(--input);border-radius:8px;display:flex;align-items:center;padding:4px 8px}
#msgInput{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:15px;padding:10px}
#sendBtn{background:none;color:var(--muted);font-size:19px;padding:6px}
#sendBtn:hover{color:var(--blurple)}
.emptyState{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:8px;text-align:center;padding:20px}
/* voice panel */
#voicePanel{margin:10px;background:var(--bg3);border-radius:8px;padding:16px}
#voicePanel h3{font-size:15px;margin-bottom:10px}
.voiceBtns{display:flex;gap:8px;margin-top:12px}
.voiceBtns button{padding:9px 14px;border-radius:4px;font-weight:600;color:#fff;background:#4e5058}
.voiceBtns button.danger{background:var(--red)}
.voiceBtns button.on{background:var(--green)}
/* ---------- MEMBERS ---------- */
#memberCol{width:240px;background:var(--bg2);padding:16px 8px;overflow-y:auto;flex-shrink:0}
#memberCol h4{color:var(--muted);font-size:11px;letter-spacing:.04em;padding:0 8px 8px}
.memberItem{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:4px}
.memberItem:hover{background:rgba(255,255,255,.04)}
.memberItem .avatar{width:32px;height:32px;font-size:13px}
.memberItem .avatar .dot{border-color:var(--bg2)}
.memberItem.off{opacity:.45}
.roleTag{font-size:10px;background:var(--blurple);color:#fff;border-radius:3px;padding:1px 5px;margin-left:4px}
/* ---------- MODAL ---------- */
#modalWrap{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--bg);border-radius:8px;padding:24px;width:440px;max-width:92vw}
.modal h2{font-size:19px;margin-bottom:6px}
.modal p{color:var(--muted);font-size:14px;margin-bottom:16px}
.modal .rowBtns{display:flex;gap:10px;margin-top:16px}
.modal .rowBtns button{flex:1;padding:11px;border-radius:4px;font-weight:600}
.btnGhost{background:none;color:var(--text)}
.btnGhost:hover{text-decoration:underline}
#inviteLinkBox{background:var(--bg3);border-radius:4px;padding:11px;font-size:13px;word-break:break-all;display:flex;gap:8px;align-items:center}
#inviteLinkBox span{flex:1}
#copyInviteBtn{background:var(--blurple);color:#fff;padding:7px 12px;border-radius:4px;font-size:13px;font-weight:600;flex-shrink:0}
select{background:var(--bg3);color:var(--text);border:none;border-radius:4px;padding:11px;width:100%;font-size:15px}
/* ---------- VOICE STAGE (Discord-like) ---------- */
#voiceStatus{background:var(--bg4);padding:10px 12px;border-top:1px solid rgba(0,0,0,.25);cursor:pointer}
#voiceStatus .vsTitle{color:#23a55a;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
#voiceStatus .vsChan{color:var(--muted);font-size:12px;margin-top:2px}
#voiceStage{flex:1;display:flex;flex-direction:column;background:#000;min-height:0}
#stageGrid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;padding:16px;align-content:center;overflow-y:auto}
.tile{position:relative;background:#2b2d31;border-radius:10px;aspect-ratio:16/9;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tile.sharing{grid-column:1/-1;aspect-ratio:auto;height:100%;min-height:300px}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:0}
.tile.sharing video{object-fit:contain}
.tile .tileAvatar{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:#fff;z-index:1}
.tile .tileTag{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;font-weight:600;padding:4px 9px;border-radius:5px;display:flex;gap:6px;align-items:center;z-index:5;max-width:calc(100% - 20px)}
.tile .tileTag .mutedIco{color:#f23f43}
.tile.inviteTile{background:linear-gradient(135deg,#3a1d4d,#1e1f22);flex-direction:column;gap:14px;color:var(--text)}
.tile.inviteTile .big{font-size:44px}
.tile.inviteTile button{background:rgba(0,0,0,.55);color:#fff;padding:10px 16px;border-radius:6px;font-weight:600;font-size:14px}
.tile.inviteTile button:hover{background:rgba(0,0,0,.8)}
#voiceControls{display:flex;justify-content:center;align-items:center;gap:10px;padding:14px;background:#000}
.vcBtn{width:52px;height:44px;border-radius:9px;background:#2b2d31;color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center;position:relative}
.vcBtn:hover{background:#3a3d43}
.vcBtn.off{background:#f23f43}
.vcBtn.on{background:#23a55a}
.vcBtn.leave{background:#f23f43;width:60px}
.vcBtn.leave:hover{background:#d63639}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#1a1b1e;border-radius:4px}::-webkit-scrollbar-track{background:transparent}
@media(max-width:820px){#memberCol{display:none}#channelCol{width:200px}}
</style>
</head>
<body>

<!-- AUTH -->
<div id="authView">
  <div class="authCard">
    <h1 id="authTitle">Chào mừng trở lại!</h1>
    <p class="sub" id="authSub">Tụi mình rất vui khi gặp lại bạn.</p>
    <div id="inviteBanner" class="hidden"></div>
    <div id="authErr" class="authErr hidden"></div>
    <div class="field hidden" id="displayNameField"><label>Tên hiển thị</label><input id="displayNameInput" placeholder="Ví dụ: Kord" maxlength="40"></div>
    <div class="field"><label>Username *</label><input id="usernameInput" placeholder="chữ thường, không dấu" autocomplete="username"></div>
    <div class="field"><label>Mật khẩu *</label><input id="passwordInput" type="password" placeholder="Tối thiểu 6 ký tự" autocomplete="current-password"></div>
    <button class="btnPrimary" id="authSubmitBtn">Đăng nhập</button>
    <div id="guestBox" class="hidden" style="margin-top:18px;border-top:1px solid #3f4147;padding-top:16px">
      <div style="font-size:13px;color:var(--muted);text-align:center;margin-bottom:10px">— hoặc vào nhanh, không cần tài khoản —</div>
      <div class="field"><label>Tên của bạn (chế độ khách)</label><input id="guestNameInput" placeholder="Ví dụ: Minh" maxlength="40"></div>
      <button class="btnPrimary" id="guestJoinBtn" style="background:var(--green)">Vào server với tư cách khách</button>
      <div style="font-size:12px;color:var(--muted);text-align:center;margin-top:8px">Khách chat + voice được ngay, nhưng không tạo server/kênh được.</div>
    </div>
    <div class="authSwitch" id="authSwitch">Chưa có tài khoản? <a id="switchModeLink">Đăng ký</a></div>
  </div>
</div>

<!-- APP -->
<div id="appView" class="hidden">
  <div id="serverRail"></div>
  <div id="channelCol">
    <div id="serverHeader"><span id="serverName">Chọn server</span><button id="inviteBtn" class="hidden">+ Mời</button></div>
    <div id="channelList"></div>
    <div id="voiceStatus" class="hidden" title="Bấm để mở lại phòng voice">
      <div class="vsTitle">📶 Đã Kết Nối Giọng</div>
      <div class="vsChan" id="voiceStatusChan"></div>
    </div>
    <div id="remoteAudios" class="hidden"></div>
    <div id="userBar">
      <div class="avatar" id="myAvatar">?<span class="dot"></span></div>
      <div><div class="uname" id="myName"></div><div class="ustatus">Trực tuyến</div></div>
      <button id="logoutBtn" title="Đăng xuất">⏻</button>
    </div>
  </div>
  <div id="mainCol">
    <div id="chatHeader"><span class="hash" id="chatHash">#</span><span id="chatChannelName">chung</span><span class="topic">Nhắn tin cùng bạn bè trong server</span></div>
    <div id="messages"></div>
    <div id="typingBar"></div>
    <div id="inputBar"><div id="msgInputWrap"><input id="msgInput" placeholder="Nhắn tin..." maxlength="2000"><button id="sendBtn" title="Gửi">➤</button></div></div>
    <div id="voiceStage" class="hidden">
      <div id="stageGrid"></div>
      <div id="voiceControls">
        <button class="vcBtn" id="stageMicBtn" title="Tắt / bật mic">🎤</button>
        <button class="vcBtn" id="stageCamBtn" title="Bật / tắt camera">📷</button>
        <button class="vcBtn" id="stageShareBtn" title="Chia sẻ màn hình">🖥️</button>
        <button class="vcBtn leave" id="stageLeaveBtn" title="Rời kênh voice">📞</button>
      </div>
    </div>
  </div>
  <div id="memberCol"><h4>THÀNH VIÊN</h4><div id="memberList"></div></div>
</div>

<!-- MODAL -->
<div id="modalWrap" class="hidden"><div class="modal" id="modalBox"></div></div>

<script>
const $=s=>document.querySelector(s);
let token=localStorage.getItem('kc_token')||'';
let me=null, socket=null;
let servers=[], currentServer=null, channels=[], currentChannel=null;
let mode='login'; // or register
const pendingInvite=new URLSearchParams(location.search).get('invite') || (location.pathname.startsWith('/invite/')?location.pathname.split('/invite/')[1]:null);
let invitePreview=null;

/* ---------- API ---------- */
async function api(path, opts={}){
  const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||('Lỗi '+r.status));
  return data;
}
const initials=n=>n.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime=t=>{const d=new Date(t);return d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})+' '+d.toLocaleDateString('vi-VN')};

/* ---------- AUTH ---------- */
function setMode(m){mode=m;
  $('#authTitle').textContent=m==='login'?'Chào mừng trở lại!':'Tạo tài khoản';
  $('#authSub').textContent=m==='login'?'Tụi mình rất vui khi gặp lại bạn.':'Tham gia và chat cùng bạn bè ngay.';
  $('#displayNameField').classList.toggle('hidden',m==='login');
  $('#authSubmitBtn').textContent=m==='login'?'Đăng nhập':'Đăng ký';
  $('#authSwitch').innerHTML=m==='login'?'Chưa có tài khoản? <a id="switchModeLink">Đăng ký</a>':'Đã có tài khoản? <a id="switchModeLink">Đăng nhập</a>';
  $('#switchModeLink').onclick=()=>setMode(m==='login'?'register':'login');
  $('#authErr').classList.add('hidden');
}
$('#switchModeLink').onclick=()=>setMode('register');
async function checkInvitePreview(){
  if(!pendingInvite) return;
  try{ invitePreview=await api('/api/invite/'+pendingInvite);
    $('#inviteBanner').textContent='💌 Bạn được mời vào server "'+invitePreview.server.name+'" ('+invitePreview.server.memberCount+' thành viên). Đăng nhập / đăng ký xong là vào luôn!';
    $('#inviteBanner').classList.remove('hidden');
    if(invitePreview.server.allowGuests!==false && !token) $('#guestBox').classList.remove('hidden');
  }catch(e){ $('#inviteBanner').textContent='⚠️ Link mời này không còn hiệu lực.'; $('#inviteBanner').classList.remove('hidden'); }
}
async function doAuth(){
  const username=$('#usernameInput').value.trim(), password=$('#passwordInput').value;
  try{
    const path=mode==='login'?'/api/login':'/api/register';
    const body=mode==='login'?{username,password}:{username,password,displayName:$('#displayNameInput').value.trim()||username};
    const data=await api(path,{method:'POST',body:JSON.stringify(body)});
    token=data.token; me=data.user; localStorage.setItem('kc_token',token);
    await afterLogin();
  }catch(e){ const el=$('#authErr'); el.textContent=e.message; el.classList.remove('hidden'); }
}
async function doGuestJoin(){
  const displayName=$('#guestNameInput').value.trim();
  if(displayName.length<2){ const el=$('#authErr'); el.textContent='Tên khách tối thiểu 2 ký tự'; el.classList.remove('hidden'); return; }
  try{
    const data=await api('/api/invite/'+pendingInvite+'/guest-join',{method:'POST',body:JSON.stringify({displayName})});
    token=data.token; me=data.user; localStorage.setItem('kc_token',token);
    invitePreview=null; history.replaceState({},'','/');
    await afterLogin();
  }catch(e){ const el=$('#authErr'); el.textContent=e.message; el.classList.remove('hidden'); }
}
$('#guestJoinBtn').onclick=doGuestJoin;
$('#guestNameInput').addEventListener('keydown',e=>{if(e.key==='Enter')doGuestJoin()});
$('#authSubmitBtn').onclick=doAuth;
$('#passwordInput').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth()});

async function afterLogin(){
  $('#authView').classList.add('hidden'); $('#appView').classList.remove('hidden'); $('#appView').style.display='flex';
  $('#myName').textContent=me.displayName; const av=$('#myAvatar'); av.style.background=me.color; av.innerHTML=esc(initials(me.displayName))+'<span class="dot"></span>';
  document.querySelector('.ustatus').textContent=me.isGuest?'Khách — chưa có tài khoản':'Trực tuyến';
  connectSocket();
  if(pendingInvite && invitePreview){
    try{ const j=await api('/api/invite/'+pendingInvite+'/join',{method:'POST',body:'{}'});
      history.replaceState({},'','/');
      await loadServers(); selectServer(j.server.id); return;
    }catch(e){ alert(e.message); }
  }
  await loadServers();
  if(servers.length) selectServer(servers[0].id);
  else showEmptyMain('Chưa có server nào','Bấm dấu + ở cột trái để tạo server đầu tiên, rồi gửi link mời cho bạn bè nhé.');
}
function showEmptyMain(t,s){ $('#messages').innerHTML='<div class="emptyState"><div style="font-size:40px">💬</div><div style="font-weight:700;color:var(--text);font-size:17px">'+esc(t)+'</div><div>'+esc(s)+'</div></div>'; }

/* ---------- SOCKET ---------- */
function connectSocket(){
  socket=io({auth:{token}});
  socket.on('new-message',msg=>{ if(currentChannel && msg.channelId===currentChannel.id) appendMessage(msg,true); });
  socket.on('channels-changed',({serverId})=>{ if(currentServer&&serverId===currentServer.id) loadChannels(); });
  socket.on('members-changed',({serverId})=>{ if(currentServer&&serverId===currentServer.id) loadMembers(); });
  socket.on('presence',()=>{ if(currentServer) loadMembers(); });
  socket.on('typing',({channelId,user})=>{ if(currentChannel&&channelId===currentChannel.id){ $('#typingBar').textContent=user.displayName+' đang nhập...'; clearTimeout(window._tt); window._tt=setTimeout(()=>$('#typingBar').textContent='',1800);} });
  setupVoiceSignalling();
}

/* ---------- SERVERS / CHANNELS ---------- */
async function loadServers(){ const d=await api('/api/servers'); servers=d.servers; renderRail(); }
function renderRail(){
  const rail=$('#serverRail'); rail.innerHTML='';
  servers.forEach(s=>{ const el=document.createElement('div'); el.className='serverIcon'+(currentServer&&s.id===currentServer.id?' active':''); el.style.background=s.color; el.textContent=initials(s.name); el.title=s.name; el.onclick=()=>selectServer(s.id); rail.appendChild(el); });
  const sep=document.createElement('div'); sep.className='railSep'; rail.appendChild(sep);
  if(!(me&&me.isGuest)){ const add=document.createElement('div'); add.className='serverIcon add'; add.textContent='+'; add.title='Tạo server'; add.onclick=openCreateServer; rail.appendChild(add); }
}
async function selectServer(sid){
  currentServer=servers.find(s=>s.id===sid); if(!currentServer) return;
  renderRail(); $('#serverName').textContent=currentServer.name; $('#inviteBtn').classList.toggle('hidden',!!(me&&me.isGuest));
  socket && socket.emit('join-server-room',{serverId:sid});
  await loadChannels(); loadMembers();
}
async function loadChannels(){
  const d=await api('/api/servers/'+currentServer.id+'/channels'); channels=d.channels;
  renderChannels();
  const firstText=channels.find(c=>c.type==='text');
  if(firstText && (!currentChannel || currentChannel.serverId!==currentServer.id)) selectChannel(firstText.id);
  else if(currentChannel) renderChannels();
}
function renderChannels(){
  const list=$('#channelList'); list.innerHTML='';
  [['KÊNH CHAT','text'],['KÊNH VOICE','voice']].forEach(([cat,type])=>{
    const row=document.createElement('div'); row.className='catRow'; row.innerHTML='<span>'+cat+'</span>';
    const b=document.createElement('button'); b.textContent='+'; b.title='Tạo kênh '+type; b.onclick=()=>openCreateChannel(type); row.appendChild(b); list.appendChild(row);
    channels.filter(c=>c.type===type).forEach(c=>{
      const el=document.createElement('div'); el.className='channelItem'+(currentChannel&&c.id===currentChannel.id&&type==='text'?' active':'');
      el.innerHTML=(type==='text'?'<span class="hash">#</span>':'<span class="spk">🔊</span>')+'<span>'+esc(c.name)+'</span>';
      el.onclick=()=> type==='text'?selectChannel(c.id):joinVoice(c);
      list.appendChild(el);
      if(type==='voice'){ const vu=document.createElement('div'); vu.className='voiceUsers'; vu.id='vu-'+c.id; list.appendChild(vu); }
    });
  });
}
async function selectChannel(cid){
  currentChannel=channels.find(c=>c.id===cid); if(!currentChannel) return;
  showChat();
  renderChannels(); $('#chatChannelName').textContent=currentChannel.name;
  $('#msgInput').placeholder='Nhắn #'+currentChannel.name+'...';
  const d=await api('/api/servers/'+currentServer.id+'/messages?channelId='+cid);
  $('#messages').innerHTML=''; d.messages.forEach(m=>appendMessage(m,false));
  scrollBottom();
}
function appendMessage(m,scroll){
  const wrap=$('#messages'); const el=document.createElement('div'); el.className='msg';
  el.innerHTML='<div class="avatar" style="background:'+m.author.color+'">'+esc(initials(m.author.displayName))+'</div><div style="min-width:0"><div class="msgHead"><span class="msgAuthor">'+esc(m.author.displayName)+'</span>'+(m.author.isGuest?'<span class="roleTag" style="background:#4e5058">KHÁCH</span>':'')+'<span class="msgTime">'+fmtTime(m.createdAt)+'</span></div><div class="msgBody">'+esc(m.content)+'</div></div>';
  wrap.appendChild(el); if(scroll) scrollBottom();
}
function scrollBottom(){ const m=$('#messages'); m.scrollTop=m.scrollHeight; }
async function loadMembers(){
  if(!currentServer) return;
  const d=await api('/api/servers/'+currentServer.id+'/members');
  const list=$('#memberList'); list.innerHTML='';
  const sorted=[...d.members].sort((a,b)=>(b.online-a.online)||a.displayName.localeCompare(b.displayName));
  $('#memberCol').querySelector('h4').textContent='THÀNH VIÊN — '+d.members.length;
  sorted.forEach(m=>{ const el=document.createElement('div'); el.className='memberItem'+(m.online?'':' off');
    el.innerHTML='<div class="avatar" style="background:'+m.color+'">'+esc(initials(m.displayName))+'<span class="dot" style="background:'+(m.online?'var(--green)':'#80848e')+'"></span></div><span>'+esc(m.displayName)+(m.role==='owner'?'<span class="roleTag">CHỦ SERVER</span>':(m.isGuest||m.role==='guest')?'<span class="roleTag" style="background:#4e5058">KHÁCH</span>':'')+'</span>';
    list.appendChild(el); });
}
function sendCurrent(){
  const v=$('#msgInput').value.trim(); if(!v||!currentServer||!currentChannel) return;
  socket.emit('send-message',{serverId:currentServer.id,channelId:currentChannel.id,content:v},r=>{ if(r&&r.error) alert(r.error); });
  $('#msgInput').value='';
}
$('#sendBtn').onclick=sendCurrent;
$('#msgInput').addEventListener('keydown',e=>{ if(e.key==='Enter') sendCurrent(); });
$('#msgInput').addEventListener('input',()=>{ if(currentServer&&currentChannel) socket.emit('typing',{serverId:currentServer.id,channelId:currentChannel.id}); });
$('#logoutBtn').onclick=()=>{ localStorage.removeItem('kc_token'); location.reload(); };

/* ---------- MODALS ---------- */
function openModal(html){ $('#modalBox').innerHTML=html; $('#modalWrap').classList.remove('hidden'); }
function closeModal(){ $('#modalWrap').classList.add('hidden'); }
$('#modalWrap').addEventListener('click',e=>{ if(e.target.id==='modalWrap') closeModal(); });
function openCreateServer(){
  openModal('<h2>Tạo server của bạn</h2><p>Server là nơi bạn và bạn bè chat, gọi voice cùng nhau.</p><div class="field"><label>Tên server *</label><input id="newServerName" placeholder="Ví dụ: Nhóm bạn bè" maxlength="60" style="width:100%;background:var(--bg3);border:none;border-radius:4px;padding:11px;color:var(--text)"></div><div class="rowBtns"><button class="btnGhost" onclick="closeModal()">Hủy</button><button class="btnPrimary" id="doCreateServer">Tạo server</button></div>');
  $('#doCreateServer').onclick=async()=>{ try{ const d=await api('/api/servers',{method:'POST',body:JSON.stringify({name:$('#newServerName').value})}); closeModal(); await loadServers(); selectServer(d.server.id); openInvite(d.inviteCode); }catch(e){ alert(e.message); } };
}
function openCreateChannel(type){
  openModal('<h2>Tạo kênh '+(type==='voice'?'voice':'text')+'</h2><p>Kênh thuộc server "'+esc(currentServer.name)+'"</p><div class="field"><label>Tên kênh *</label><input id="newChannelName" placeholder="'+(type==='voice'?'Phòng Voice mới':'kenh-moi')+'" maxlength="40" style="width:100%;background:var(--bg3);border:none;border-radius:4px;padding:11px;color:var(--text)"></div><div class="rowBtns"><button class="btnGhost" onclick="closeModal()">Hủy</button><button class="btnPrimary" id="doCreateChannel">Tạo kênh</button></div>');
  $('#doCreateChannel').onclick=async()=>{ try{ await api('/api/servers/'+currentServer.id+'/channels',{method:'POST',body:JSON.stringify({name:$('#newChannelName').value,type})}); closeModal(); loadChannels(); }catch(e){ alert(e.message); } };
}
async function openInvite(existingCode){
  let codeVal=existingCode;
  if(!codeVal){ const d=await api('/api/servers/'+currentServer.id+'/invite'); codeVal=d.inviteCode; }
  const url=location.origin+'/invite/'+codeVal;
  const isOwner=currentServer.role==='owner';
  openModal('<h2>Mời bạn bè vào "'+esc(currentServer.name)+'"</h2><p>Gửi link này cho bạn bè. Họ bấm vào là vào được ngay bằng chế độ khách (chỉ cần gõ tên), hoặc đăng ký tài khoản để dùng lâu dài.</p><div id="inviteLinkBox"><span id="inviteUrlText">'+esc(url)+'</span><button id="copyInviteBtn">Sao chép</button></div>'+(isOwner?'<label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px;cursor:pointer"><input type="checkbox" id="allowGuestsChk" '+(currentServer.allowGuests!==false?'checked':'')+'> Cho phép khách vào bằng link (không cần tài khoản)</label>':'')+'<div class="rowBtns"><button class="btnGhost" id="revokeInviteBtn" style="color:var(--red)">Thu hồi link này</button><button class="btnPrimary" onclick="closeModal()">Xong</button></div>');
  if(isOwner){ $('#allowGuestsChk').onchange=async e=>{ try{ const d=await api('/api/servers/'+currentServer.id+'/settings',{method:'PATCH',body:JSON.stringify({allowGuests:e.target.checked})}); currentServer.allowGuests=d.server.allowGuests; }catch(err){ alert(err.message); e.target.checked=!e.target.checked; } }; }
  $('#copyInviteBtn').onclick=async()=>{ try{ await navigator.clipboard.writeText(url); $('#copyInviteBtn').textContent='Đã chép ✓'; }catch{ prompt('Chép link mời:',url); } };
  $('#revokeInviteBtn').onclick=async()=>{ if(!confirm('Thu hồi link mời này? Người có link cũ sẽ không vào được nữa.')) return; try{ await api('/api/invite/'+codeVal,{method:'DELETE'}); closeModal(); alert('Đã thu hồi. Bấm Mời lại để tạo link mới.'); }catch(e){ alert(e.message); } };
}
$('#inviteBtn').onclick=()=>openInvite(null);

/* ---------- VOICE STAGE (WebRTC mesh, audio + camera + screen) ---------- */
let localStream=null, camStream=null, screenStream=null, peers={}, voiceChannel=null;
let muted=false, camOn=false, sharing=false, stageOpen=false;
let dummyTrack=null;
function getDummyTrack(){
  if(dummyTrack && dummyTrack.readyState==='live') return dummyTrack;
  const cv=document.createElement('canvas'); cv.width=2; cv.height=2;
  const ctx=cv.getContext('2d'); ctx.fillStyle='#000'; ctx.fillRect(0,0,2,2);
  dummyTrack=cv.captureStream(1).getVideoTracks()[0];
  return dummyTrack;
}
function desiredVideoTrack(){ if(sharing && screenStream) return screenStream.getVideoTracks()[0]; if(camOn && camStream) return camStream.getVideoTracks()[0]; return getDummyTrack(); }
async function applyVideoToPeers(){
  const t=desiredVideoTrack();
  for(const pc of Object.values(peers)){ const sender=pc.getSenders().find(s=>s.track&&s.track.kind==='video'); if(sender){ try{ await sender.replaceTrack(t); }catch{} } }
  updateLocalTileVideo();
}
function emitVoiceState(){ if(socket&&voiceChannel) socket.emit('voice-state',{camOn,sharing,muted}); }

/* ----- stage / chat visibility ----- */
function showStage(){
  if(!voiceChannel) return; stageOpen=true;
  $('#voiceStage').classList.remove('hidden');
  $('#messages').classList.add('hidden'); $('#typingBar').classList.add('hidden'); $('#inputBar').classList.add('hidden');
  $('#chatChannelName').textContent=voiceChannel.name; $('#chatHash').textContent='🔊';
  document.querySelector('#chatHeader .topic').textContent='Kênh thoại — bấm kênh chat bên trái để quay lại nhắn tin, voice vẫn giữ';
  renderStage();
}
function showChat(){
  stageOpen=false;
  $('#voiceStage').classList.add('hidden');
  $('#messages').classList.remove('hidden'); $('#typingBar').classList.remove('hidden'); $('#inputBar').classList.remove('hidden');
  $('#chatHash').textContent='#';
  document.querySelector('#chatHeader .topic').textContent='Nhắn tin cùng bạn bè trong server';
  if(currentChannel) $('#chatChannelName').textContent=currentChannel.name;
}
$('#voiceStatus').onclick=showStage;

/* ----- tiles ----- */
const tiles={}; // key: 'local' or socketId -> {el, video, avatarEl, tagEl, user}
function ensureTile(key,user,isLocal){
  if(tiles[key]){ if(user) tiles[key].user=user; return tiles[key]; }
  const el=document.createElement('div'); el.className='tile';
  el.innerHTML='<video autoplay playsinline '+(isLocal?'muted':'')+' style="display:none"></video><div class="tileAvatar"></div><div class="tileTag"></div>';
  const av=el.querySelector('.tileAvatar'); av.style.background=(user&&user.color)||'#5865f2'; av.textContent=user?initials(user.displayName):'?';
  el.querySelector('video').style.display='none';
  $('#stageGrid').appendChild(el);
  tiles[key]={el,video:el.querySelector('video'),avatarEl:av,tagEl:el.querySelector('.tileTag'),user};
  updateTileTag(key); return tiles[key];
}
function updateTileTag(key){
  const t=tiles[key]; if(!t||!t.user) return;
  const isMe=key==='local';
  const m=isMe?muted:t.user.muted;
  t.tagEl.innerHTML=(m?'<span class="mutedIco">🔇</span>':'')+'<span>'+esc(t.user.displayName)+(isMe?' (bạn)':'')+'</span>'+(t.user.sharing?'<span>📺 đang chia sẻ</span>':'');
  t.el.classList.toggle('sharing',!!t.user.sharing);
}
function removeTile(key){ const t=tiles[key]; if(t){ t.el.remove(); delete tiles[key]; } renderInviteTile(); }
function renderStage(){
  if(!voiceChannel) return;
  ensureTile('local',{...me,muted,camOn,sharing},true);
  updateTileTag('local'); updateLocalTileVideo(); renderInviteTile();
}
function renderInviteTile(){
  const old=document.getElementById('inviteTile'); if(old) old.remove();
  if(!voiceChannel) return;
  if(Object.keys(tiles).length<=1){
    const el=document.createElement('div'); el.className='tile inviteTile'; el.id='inviteTile';
    el.innerHTML='<div class="big">🏆</div><div style="color:var(--muted);font-size:14px">Đang một mình trong phòng — mời bạn bè vào cho vui</div>';
    const b=document.createElement('button'); b.textContent='👥 Mời vào Kênh thoại'; b.onclick=()=>openInvite(null); el.appendChild(b);
    $('#stageGrid').appendChild(el);
  }
}
function updateLocalTileVideo(){
  const t=tiles['local']; if(!t) return;
  const active=(sharing&&screenStream)||(camOn&&camStream);
  if(active){ t.video.srcObject=active; t.video.style.display='block'; t.avatarEl.style.display='none'; }
  else { t.video.srcObject=null; t.video.style.display='none'; t.avatarEl.style.display='flex'; }
  if(t.user){ t.user.camOn=camOn; t.user.sharing=sharing; t.user.muted=muted; updateTileTag('local'); }
}

/* ----- signalling ----- */
function setupVoiceSignalling(){
  socket.on('voice-peers',async({peers:ps})=>{ for(const p of ps){ ensureTile(p.socketId,p.user,false); await makePeer(p.socketId,true); } renderInviteTile(); });
  socket.on('voice-user-joined',({socketId,user})=>{ ensureTile(socketId,user,false); renderInviteTile(); });
  socket.on('voice-user-left',({socketId})=>{ closePeer(socketId); removeTile(socketId); });
  socket.on('voice-participant-state',({socketId,user})=>{ const t=ensureTile(socketId,user,false); t.user=user; updateTileTag(socketId); });
  socket.on('voice-offer',async({from,data})=>{ const pc=await makePeer(from,false); await pc.setRemoteDescription(data); const ans=await pc.createAnswer(); await pc.setLocalDescription(ans); socket.emit('voice-answer',{to:from,data:pc.localDescription}); });
  socket.on('voice-answer',async({from,data})=>{ const pc=peers[from]; if(pc) await pc.setRemoteDescription(data); });
  socket.on('voice-ice',async({from,data})=>{ const pc=peers[from]; if(pc&&data) try{ await pc.addIceCandidate(data); }catch{} });
  socket.on('voice-participants',({channelId,participants})=>{ const el=document.getElementById('vu-'+channelId); if(el) el.innerHTML=participants.map(u=>'<div><span class="dot"></span>'+esc(u.displayName)+(u.sharing?' 📺':'')+'</div>').join('');
    if(voiceChannel&&voiceChannel.id===channelId){ participants.forEach(u=>{}); } });
}
async function makePeer(socketId,initiator){
  if(peers[socketId]) return peers[socketId];
  const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  peers[socketId]=pc;
  if(localStream) localStream.getAudioTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.addTrack(getDummyTrack());
  // If we already have cam/screen on, put the real video on this new peer right away
  const want=desiredVideoTrack();
  if(want!==getDummyTrack()){ const sender=pc.getSenders().find(s=>s.track&&s.track.kind==='video'); if(sender) sender.replaceTrack(want).catch(()=>{}); }
  pc.onicecandidate=e=>{ if(e.candidate) socket.emit('voice-ice',{to:socketId,data:e.candidate}); };
  pc.ontrack=e=>{
    const t=ensureTile(socketId,(tiles[socketId]&&tiles[socketId].user)||null,false);
    if(e.track.kind==='audio'){
      let a=document.getElementById('audio-'+socketId); if(!a){ a=document.createElement('audio'); a.id='audio-'+socketId; a.autoplay=true; $('#remoteAudios').appendChild(a);} a.srcObject=new MediaStream([e.track]);
    } else if(e.track.kind==='video'){
      t.video.srcObject=new MediaStream([e.track]);
      const show=()=>{ const hasReal=!(e.track.getSettings&&e.track.getSettings().width<=2); };
      e.track.onunmute=()=>{ t.video.style.display='block'; t.avatarEl.style.display='none'; };
      e.track.onmute=()=>{ t.video.style.display='none'; t.avatarEl.style.display='flex'; };
      // Placeholder (2x2 canvas) also fires ontrack: only reveal video once frames are real-sized
      const iv=setInterval(()=>{ if(t.video.videoWidth>2){ t.video.style.display='block'; t.avatarEl.style.display='none'; clearInterval(iv); } },400);
      setTimeout(()=>clearInterval(iv),15000);
    }
  };
  if(initiator){ const offer=await pc.createOffer(); await pc.setLocalDescription(offer); socket.emit('voice-offer',{to:socketId,data:pc.localDescription}); }
  return pc;
}
function closePeer(socketId){ const pc=peers[socketId]; if(pc){ pc.close(); delete peers[socketId]; } const a=document.getElementById('audio-'+socketId); if(a) a.remove(); }
async function joinVoice(channel){
  if(voiceChannel && voiceChannel.id===channel.id){ showStage(); return; }
  if(voiceChannel) leaveVoice();
  try{ localStream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ alert('Không mở được micro. Anh kiểm tra quyền micro của trình duyệt nhé.'); return; }
  voiceChannel=channel; muted=false; camOn=false; sharing=false;
  $('#voiceStatus').classList.remove('hidden'); $('#voiceStatusChan').textContent=channel.name;
  $('#stageMicBtn').classList.remove('off'); $('#stageMicBtn').textContent='🎤';
  $('#stageCamBtn').classList.remove('on'); $('#stageShareBtn').classList.remove('on');
  socket.emit('voice-join',{channelId:channel.id});
  showStage();
}
function stopCam(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } camOn=false; }
function stopShare(){ if(screenStream){ screenStream.getTracks().forEach(t=>t.stop()); screenStream=null; } sharing=false; }
function leaveVoice(){
  if(!voiceChannel) return;
  socket.emit('voice-leave',{});
  Object.keys(peers).forEach(closePeer); peers={};
  Object.keys(tiles).forEach(removeTile);
  stopCam(); stopShare();
  localStream && localStream.getTracks().forEach(t=>t.stop()); localStream=null; voiceChannel=null;
  $('#voiceStatus').classList.add('hidden');
  showChat();
}
$('#stageLeaveBtn').onclick=leaveVoice;
$('#stageMicBtn').onclick=()=>{ if(!localStream) return; muted=!muted; localStream.getAudioTracks().forEach(t=>t.enabled=!muted); $('#stageMicBtn').textContent=muted?'🔇':'🎤'; $('#stageMicBtn').classList.toggle('off',muted); emitVoiceState(); updateLocalTileVideo(); };
$('#stageCamBtn').onclick=async()=>{
  if(!voiceChannel) return;
  if(camOn){ stopCam(); }
  else{
    try{ camStream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},frameRate:{max:24}}}); camOn=true; }
    catch(e){ alert('Không mở được camera. Anh kiểm tra quyền camera của trình duyệt nhé.'); return; }
  }
  $('#stageCamBtn').classList.toggle('on',camOn);
  await applyVideoToPeers(); emitVoiceState(); updateLocalTileVideo();
};
$('#stageShareBtn').onclick=async()=>{
  if(!voiceChannel) return;
  if(sharing){ stopShare(); }
  else{
    if(!navigator.mediaDevices.getDisplayMedia){ alert('Trình duyệt này không hỗ trợ chia sẻ màn hình (thường là trên điện thoại). Anh dùng máy tính với Chrome/Edge/Cốc Cốc nhé.'); return; }
    try{ screenStream=await navigator.mediaDevices.getDisplayMedia({video:{width:{max:1280},height:{max:720},frameRate:{max:30}}}); sharing=true; screenStream.getVideoTracks()[0].onended=async()=>{ if(sharing){ stopShare(); $('#stageShareBtn').classList.remove('on'); await applyVideoToPeers(); emitVoiceState(); updateLocalTileVideo(); } }; }
    catch(e){ return; /* user cancelled the picker */ }
  }
  $('#stageShareBtn').classList.toggle('on',sharing);
  await applyVideoToPeers(); emitVoiceState(); updateLocalTileVideo();
};

/* ---------- BOOT ---------- */
(async()=>{ setMode('login'); await checkInvitePreview();
  if(token){ try{ const d=await api('/api/me'); me=d.user; await afterLogin(); }catch{ token=''; localStorage.removeItem('kc_token'); } }
})();
</script>
